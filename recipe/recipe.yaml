context:
  version: "1.18.1"
  # Update the numpy value here to the most recent released version
  # when updating to a new scipy feature release; override default pins
  numpy_pin: "2.5"
  numpy_minor: ${{ (numpy_pin | split(".") | list)[1] | int }}
  # tests for cross-compiled targets run in emulation through QEMU; as this takes
  # much longer, do not run the most heavy-weight tests, i.e. use label='fast'
  test_label: ${{ "fast" if build_platform != target_platform else "full" }}
  tests_to_skip: >-
    ${{ "_not_a_real_test"
    ~ (" or (TestSystematic and test_spherical)" if target_platform == "linux-aarch64" else "")
    ~ (" or (test_convergence and rand-sym-pd-F-cgs)" if target_platform == "win-arm64" else "")
    ~ (" or (TestVectorNorms and test_stable)" if target_platform == "linux-riscv64" else "")
    ~ (" or test_precond_dummy[poisson2d-F-cgs-numpy-batch_b0-batch_A0]" if target_platform == "linux-riscv64" else "")
    ~ (" or test_nan_inputs[airye]" if target_platform == "linux-riscv64" else "")
    ~ (" or test_all_nograd_minimizers"
       ~ " or test_mixed_threads_processes or test_sf_gh18506"
       ~ " or test_quad_vec_pool"
       ~ " or (test_lsq_linear and test_large_rank_deficient)"
       ~ " or (test_iterative and test_precond_inverse)"
       ~ " or (test_multiprocess and fft)"
       ~ " or (TestLstsq and test_random_complex_exact)"
       ~ " or (TestLevyStable and test_location_scale)"
       ~ " or (TestShgoArguments and test_19_parallelization)"
       ~ " or (test_workers and (TestBrute or TestDogbox or TestLM or TestTRF))"
       ~ " or (test_workers and (TestScalarFunction or TestVectorialFunction))"
       ~ " or (TestWorkers and (test_smoke or test_equal_bounds))"
       ~ " or (TestApproxDerivatives and (test_all or test_scalar_vector))"
       ~ " or (TestApproxDerivatives and (test_vector_vector or test_workers_evaluations))"
       ~ " or (TestDifferentialEvolutionSolver and (test_immediate_updating or test_parallel))"
       ~ " or (test_propack and test_examples)"
       if build_platform != target_platform else "")
    }}

recipe:
  name: scipy-split
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/scipy/scipy-${{ version }}.tar.gz
  sha256: 52c4b7422442aba924d03ad4019852b08a92e64ea187b933135687bfe2747307
  patches:
    # backport https://github.com/scipy/scipy/pull/25571
    - patches/0001-TST-loosen-signal-test-tolerances-for-FMA-contractio.patch
    # backport https://github.com/scipy/scipy/pull/25632
    - patches/0002-TST-sparse.linalg-skip-tfqmr-rand-sym-pd-F-on-all-pl.patch
    - patches/0003-preserve-sici-signed-zero.patch

build:
  number: 2
  skip:
    - match(python, "<3.12")

# the staging output builds the scipy wheel (build.{sh,bat}), and then
# build-output.{sh,bat} installs the files for each package output
outputs:
  - staging:
      name: scipy-build
    build:
      script: build
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - cython
            - numpy ${{ numpy_pin }}.*
            - pybind11
            - meson-python
            - cmake
            - ninja
            - pkg-config
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        # pythran code needs clang-cl on windows
        - if: win
          then: clang
      host:
        - libblas
        - libcblas
        - liblapack
        - python
        - cython
        # for https://github.com/scipy/scipy/issues/25904
        - meson <1.12
        - meson-python
        - ninja
        - pkg-config
        - python-build
        - pybind11
        - pythran
        - numpy ${{ numpy_pin }}.*
        - pip

  - package:
      name: scipy
    inherit: scipy-build
    build:
      script:
        file: build-output
        env:
          is_freethreading: ${{ (is_freethreading ~ "") | lower }}
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
        # only need these for the strong run exports
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
      host:
        - libblas
        - libcblas
        - liblapack
        - python
        - cython
        # for https://github.com/scipy/scipy/issues/25904
        - meson <1.12
        - meson-python
        - ninja
        - pkg-config
        - python-build
        - pybind11
        - pythran
        - numpy ${{ numpy_pin }}.*
        - pip
      run:
        - python
        # numpy's run-export only requires <3 because not every package
        # is exposed as deeply to its ABI. scipy however only supports
        # the two next minor versions after the numpy we build against, see
        # https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
        - numpy <2.${{ numpy_minor + 3 }}
        # double-check lower bound from
        # https://github.com/scipy/scipy/blob/v${{ version }}/pyproject.toml#L55
        - numpy >=2.0.0
      ignore_run_exports:
        by_name:
          - if: win
            then: libflang
    tests:
      - python:
          imports:
            - scipy
            # reference for public API is effectively
            # https://github.com/scipy/scipy/blob/main/scipy/_lib/tests/test_public_api.py
            - scipy.cluster
            - scipy.cluster.hierarchy
            - scipy.cluster.vq
            - scipy.constants
            - scipy.datasets
            - scipy.fft
            - scipy.fftpack
            - scipy.integrate
            - scipy.interpolate
            - scipy.io
            - scipy.io.arff
            - scipy.io.matlab
            - scipy.io.wavfile
            - scipy.linalg
            - scipy.linalg.blas
            - scipy.linalg.cython_blas
            - scipy.linalg.cython_lapack
            - scipy.linalg.interpolative
            - scipy.linalg.lapack
            - scipy.misc
            - scipy.ndimage
            - scipy.odr
            - scipy.optimize
            - scipy.signal
            - scipy.signal.windows
            - scipy.sparse
            - scipy.sparse.csgraph
            - scipy.sparse.linalg
            - scipy.spatial
            - scipy.spatial.distance
            - scipy.spatial.transform
            - scipy.special
            - scipy.stats
            - scipy.stats.contingency
            - scipy.stats.distributions
            - scipy.stats.mstats
            - scipy.stats.qmc
            - scipy.stats.sampling
      - package_contents:
          files:
            exists:
              # informative error for `scipy.test()` / `pytest --pyargs scipy`
              - "**/site-packages/scipy/_lib/test_conda_forge_packaging.py"
            not_exists:
              # absence of tests (selection)
              - "**/site-packages/scipy/_lib/tests/**"
              - "**/site-packages/scipy/cluster/tests/**"
              - "**/site-packages/scipy/constants/tests/**"
              - "**/site-packages/scipy/datasets/tests/**"
              - "**/site-packages/scipy/fftpack/tests/**"
              - "**/site-packages/scipy/fft/tests/**"
              - "**/site-packages/scipy/integrate/tests/**"
              - "**/site-packages/scipy/interpolate/tests/**"
              - "**/site-packages/scipy/io/tests/**"
              - "**/site-packages/scipy/linalg/tests/**"
              - "**/site-packages/scipy/misc/tests/**"
              - "**/site-packages/scipy/ndimage/tests/**"
              - "**/site-packages/scipy/odr/tests/**"
              - "**/site-packages/scipy/optimize/tests/**"
              - "**/site-packages/scipy/signal/tests/**"
              - "**/site-packages/scipy/sparse/tests/**"
              - "**/site-packages/scipy/spatial/tests/**"
              - "**/site-packages/scipy/special/tests/**"
              - "**/site-packages/scipy/stats/tests/**"
              # absence of testing DSOs (selection)
              - "**/site-packages/scipy/_lib/_test_ccallback.*"
              - "**/site-packages/scipy/integrate/_test_multivariate.*"
              - "**/site-packages/scipy/io/_test_fortran.*"
              - "**/site-packages/scipy/ndimage/_ctest.*"
              - "**/site-packages/scipy/ndimage/_cytest.*"
              - "**/site-packages/scipy/special/_test_internal.*"
      - requirements:
          run:
            - pytest
            - hypothesis
        script:
          # test that scipy.test raises an informative error
          - python -c "import scipy; throw_away_the_return_value = scipy.test()" > testlog
          - python -c "import sys; lines=open('testlog').readlines(); sys.exit(0 if any('conda-forge builds of' in x for x in lines) else 1)"
          # same for `pytest --pyargs scipy` (uses exit code that's neither 0 or 1 on win, which breaks piping)
          - if: unix
            then: (pytest --pyargs scipy || echo "failure was expected") > testlog
            # `cmd /c "exit 0"` resets the errorlevel without ending the test script
            else: (pytest --pyargs scipy || cmd /c "exit 0") > testlog
          - python -c "import sys; lines=open('testlog').readlines(); sys.exit(0 if any('conda-forge builds of' in x for x in lines) else 1)"
          # ensure only one test is left (namely, our hint)
          - python -c "import sys; lines=open('testlog').readlines(); sys.exit(0 if any('======== 1 failed' in x for x in lines) else 1)"

  - package:
      name: scipy-tests
    inherit: scipy-build
    build:
      script:
        file: build-output
        env:
          is_freethreading: ${{ (is_freethreading ~ "") | lower }}
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - cython
            - numpy
            - pybind11
            # for https://github.com/scipy/scipy/issues/25904
            - meson <1.12
            - meson-python
            - cmake
            - ninja
            - pkg-config
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        - if: win
          then:
            - clang
            - m2-sed
          else:
            - sed
      host:
        - ${{ pin_subpackage('scipy', exact=True) }}
        - libblas
        - libcblas
        - liblapack
        - python
        - pip
        - cython
        # for https://github.com/scipy/scipy/issues/25904
        - meson <1.12
        - meson-python
        - ninja
        - pkg-config
        - python-build
        - pybind11
        - pythran
        - numpy
      run:
        - ${{ pin_subpackage('scipy', exact=True) }}
        - python
        - pytest
        - hypothesis
        # needed for scipy.datasets
        - pooch
      ignore_run_exports:
        by_name:
          - if: win
            then: libflang
    tests:
      - requirements:
          run:
            - pytest-timeout
            - pytest-xdist
            - mpmath
        script:
          # show SIMD features (some failures occur depending on presence/absence of e.g. AVX512)
          - python -c "import numpy; numpy.show_config()"
          # for signature of scipy.test see below (note default: label='fast'):
          # https://github.com/scipy/scipy/blob/v1.7.0/scipy/_lib/_testutils.py#L27
          - python -c "import scipy, sys; sys.exit(not scipy.test(verbose=1, label='${{ test_label }}', tests=None, extra_argv=['-k', 'not (${{ tests_to_skip }})', '-nauto', '--timeout=1200', '--durations=50']))"

about:
  homepage: http://www.scipy.org/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Scientific Library for Python
  description: |
    SciPy is a Python-based ecosystem of open-source software for mathematics,
    science, and engineering.
  documentation: http://www.scipy.org/docs.html
  repository: https://github.com/scipy/scipy

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - rgommers
    - ocefpaf
    - h-vetinari
  feedstock-name: scipy
